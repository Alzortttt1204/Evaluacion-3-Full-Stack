spring.application.name=sonido-vivo-backend
server.port=8080

# ---------- Conexion a MySQL ----------
# Base de datos: sonido_vivo. Funciona con MySQL o con XAMPP (MariaDB).
# createDatabaseIfNotExist=true: si la base no existe, se crea vacia al arrancar
# y luego Flyway crea las tablas.
spring.datasource.url=jdbc:mysql://localhost:3306/sonido_vivo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
# Credenciales: cambie los valores por defecto o defina las variables DB_USER / DB_PASSWORD.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Flyway (migraciones) ----------
# Al arrancar, Flyway ejecuta en orden las migraciones de src/main/resources/db/migration
# (V1, V2, V3...) que aun no se hayan aplicado, y las anota en la tabla flyway_schema_history.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JPA / Hibernate ----------
# validate: Hibernate NO crea ni modifica tablas (eso lo hace Flyway); solo revisa
# al arrancar que las entidades calcen con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Clave para firmar los tokens. Si la variable JWT_SECRET no esta definida, se genera
# una clave al azar en cada arranque (los tokens antiguos dejan de servir al reiniciar).
jwt.secreto=${JWT_SECRET:}
# Duracion del token en minutos
jwt.expiracion-minutos=60
# Los usuarios estan en la tabla usuario: se desactiva el usuario "user" con clave
# aleatoria que Spring Security crea por defecto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- Swagger ----------
# Documentacion interactiva en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
