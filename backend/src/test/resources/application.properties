# Solo para las pruebas: base de datos H2 en memoria (la aplicacion real usa MySQL).
# Flyway ejecuta las MISMAS migraciones (V1 a V6) sobre H2 en modo MySQL.
spring.datasource.url=jdbc:h2:mem:sonido_vivo_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secreto=
jwt.expiracion-minutos=60
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
